services:
  google-drive-mcp:
    image: ghcr.io/jr-k/google-drive-mcp:latest
    pull_policy: always
    restart: unless-stopped
    init: true

    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3100
      MCP_TEAM_MODE: "true"
      MCP_TEAM_ISSUER_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN in Dokploy}
      MCP_TRUST_PROXY: "1"
      MCP_TEAM_STORE_PATH: /config/team-store.json
      GOOGLE_DRIVE_MCP_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in Dokploy}
      GOOGLE_DRIVE_MCP_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in Dokploy}

    volumes:
      - google-drive-mcp-data:/config

    expose:
      - "3100"

volumes:
  google-drive-mcp-data:
